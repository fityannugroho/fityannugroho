packages:
  - '.'

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Supply-chain policy (pnpm >=11 built-in default minimumReleaseAge: 1440).
# Only exact, unavoidable pins are exempted: lucide-react@1.55.0 is the newest
# published release and the only version the ^1.55.0 range can resolve to, so the
# lockfile cannot avoid it. Exempt the pinned version, not the whole package.
minimumReleaseAgeExclude:
  - lucide-react@1.55.0

overrides:
  # a selector earns its place only by fixing a resolution natural range resolution cannot reach, and must never lift a consumer past the major it declares
  dompurify@<3.4.16: '>=3.4.16 <4'
  sharp@<0.35.5: '>=0.35.5 <1'
  undici@<7.29.1: '>=7.29.1 <8'
  fast-uri@<3.1.8: '>=3.1.8 <4'
  fast-copy@<3.1.0: '>=3.1.0 <4'
  http-cache-semantics@<4.3.0: '>=4.3.0 <5'
  source-map-js@<1.2.2: '>=1.2.2 <2'
  smol-toml@<1.9.0: '>=1.9.0 <2'
  yaml@>=2.0.0 <2.8.3: '>=2.8.3 <3'
